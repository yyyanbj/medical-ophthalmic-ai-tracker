name: Medical & Ophthalmic AI Literature

on:
  schedule:
    # 17:30 UTC = 09:30 PST / 10:30 PDT; ahead of 19:00 LA ChatGPT recap.
    # GitHub's cron can be delayed; report uses actual run timestamp.
    - cron: '30 17 * * *'
  workflow_dispatch:
    inputs:
      lookback_days:
        description: 'UTC days to rescan (1-30, default 7)'
        required: false
        type: choice
        default: '7'
        options: ['1', '7', '14', '30']
      max_items:
        description: 'Max items per query (100-20000)'
        required: false
        type: choice
        default: '3000'
        options: ['1000', '3000', '10000']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: medical-ophthalmic-ai-tracker
  cancel-in-progress: false

jobs:
  literature:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test parser and audit logic
        run: python -m unittest discover -s tests -v
      - name: Search sources and generate Pages dashboard
        env:
          CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days || '7' }}
          MAX_ITEMS: ${{ inputs.max_items || '3000' }}
        run: python -m tracker.pipeline --days "$LOOKBACK_DAYS" --max-items "$MAX_ITEMS"
      - name: Persist public audit and deduplicated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json data/history.json data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: daily literature audit [skip ci]"
            git push origin HEAD:main
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
